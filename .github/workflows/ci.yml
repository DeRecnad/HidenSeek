name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Build online demo
        run: python tools/build_static_demo.py build/hidenseek-demo.html
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: UI tests (server + online demo)
        env:
          HIDENSEEK_DATA_DIR: ${{ runner.temp }}/data
          HIDENSEEK_KEY_FILE: ${{ runner.temp }}/key
          MODULE_DELAY: "0"
        run: |
          python -m hidenseek serve --port 8765 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/config >/dev/null && break; sleep 1; done
          node tests/e2e/ui.mjs http://127.0.0.1:8765 build/hidenseek-demo.html
      - uses: actions/upload-artifact@v4
        with:
          name: hidenseek-demo
          path: build/hidenseek-demo.html
