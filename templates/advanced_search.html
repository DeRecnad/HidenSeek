<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Search</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Advanced Search</h1>
        <a href="/">Search</a>
        <a href="/upload_image">Upload Image</a>
        <a href="/history">History</a>
    </div>
    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert">
                    {% for message in messages %}
                        {{ message }}<br>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <!-- Кнопка для переключения Instagram -->
        <button id="instagram-toggle">Включить поиск по Instagram</button>

        <form method="POST" action="/" id="search-form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter name or @username (e.g., @telegram)">
            </div>
            <div class="form-group">
                <label for="city">City:</label>
                <input type="text" id="city" name="city" placeholder="Enter city (for VK)">
            </div>
            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="text" id="phone" name="phone" placeholder="Enter phone (e.g., +79504643030)" pattern="\+7[0-9]{10}" title="Phone must be in format +7XXXXXXXXXX (e.g., +79504643030)">
            </div>
            <div class="text-center">
                <button type="submit">Search</button>
            </div>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
